<html lang="es">
<head>
<meta charset="UTF-8">
<title>Cuenta regresiva EXPO TEC 4.0</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }
  .card {
    max-width: 480px;
    width: 100%;
    text-align: center;
    background: #ffffff;
    border-radius: 20px;
    padding: 32px 24px 36px;
    box-shadow: 0 8px 30px rgba(30,42,120,0.15);
  }
  .logo {
    max-width: 260px;
    width: 70%;
    margin: 0 auto 10px;
    display: block;
  }
  .eyebrow {
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #E8541F;
    font-weight: 700;
    margin: 6px 0 4px;
  }
  h1 {
    font-size: 19px;
    font-weight: 700;
    color: #1B2F7A;
    margin: 0 0 24px;
  }
  .timer {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 26px;
  }
  .unit {
    background: linear-gradient(180deg, #1B2F7A 0%, #16245F 100%);
    border-radius: 14px;
    padding: 16px 12px;
    min-width: 74px;
    flex: 1;
  }
  .num {
    font-size: 30px;
    font-weight: 800;
    background: linear-gradient(180deg, #FDBA45 0%, #E8541F 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: #F7A93E;
  }
  .label {
    font-size: 11px;
    color: #ffffff;
    letter-spacing: 0.5px;
    margin-top: 4px;
    text-transform: uppercase;
  }
  .closing {
    font-size: 14px;
    color: #1B2F7A;
    line-height: 1.6;
    font-weight: 600;
    margin: 0 0 8px;
  }
  .pillars {
    font-size: 12px;
    color: #E8541F;
    font-weight: 700;
    letter-spacing: 0.3px;
  }
</style>
